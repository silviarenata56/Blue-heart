<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Coração Azul Mágico</title>
<style>
  :root {
    --bg1: #030712;
    --bg2: #0b1a3a;
    --blue1: #38bdf8;
    --blue2: #60a5fa;
    --blue3: #a5f3fc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1) 70%);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  canvas {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
  }
  .hint {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(165, 243, 252, 0.55);
    font-size: 13px;
    letter-spacing: 0.5px;
    text-align: center;
    pointer-events: none;
    animation: fade 3s ease-in-out infinite;
    text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
  }
  @keyframes fade {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.9; }
  }
  .title {
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--blue3);
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.8), 0 0 30px rgba(56, 189, 248, 0.4);
    pointer-events: none;
  }
  .message {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: min(90vw, 480px);
    text-align: center;
    color: #e0f7ff;
    font-size: 17px;
    font-weight: 300;
    line-height: 1.7;
    letter-spacing: 0.3px;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.55), 0 0 22px rgba(56, 189, 248, 0.25);
    pointer-events: none;
    opacity: 0;
    transition: opacity 2.2s ease;
    z-index: 2;
  }
  .message.show { opacity: 1; }
  .message .name {
    display: block;
    font-size: 26px;
    font-weight: 400;
    margin-bottom: 10px;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #a5f3fc, #60a5fa, #a5f3fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: none;
    filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.6));
  }
  .cursor-blink {
    display: inline-block;
    width: 2px;
    background: #a5f3fc;
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="title">Coração Mágico</div>
<div class="message" id="message">
  <span class="name">Daniela</span>
  <span id="messageText"></span><span class="cursor-blink" id="cursorBlink">&nbsp;</span>
</div>
<canvas id="canvas"></canvas>
<div class="hint">mova o mouse (os girassóis te seguem 🌻) · arraste o dedo · clique para explodir 💥</div>

<script>
const romanticText = "assim como esses girassóis se viram pra luz, meu mundo inteiro se vira pra você. cada batida desse coração carrega tudo o que sinto — e ainda tem muito mais pra vir. eu te amo. 💙🌻";

function typeMessage() {
  const el = document.getElementById('message');
  const textEl = document.getElementById('messageText');
  const cursor = document.getElementById('cursorBlink');
  el.classList.add('show');
  let i = 0;
  const interval = setInterval(() => {
    textEl.textContent += romanticText[i];
    i++;
    if (i >= romanticText.length) {
      clearInterval(interval);
      setTimeout(() => { cursor.style.display = 'none'; }, 1200);
    }
  }, 45);
}
setTimeout(typeMessage, 1800);
</script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// ---------- Heart curve ----------
function heartPoint(t, scale) {
  // parametric heart, t in [0, 2*PI]
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: x * scale, y: y * scale };
}

// ---------- Particles ----------
const PARTICLE_COUNT = 1400;
let particles = [];

function makeParticles() {
  particles = [];
  const baseScale = Math.min(W, H) / 34;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const t = Math.random() * Math.PI * 2;
    // random small jitter of scale so the shape has some volume/depth
    const jitter = 0.85 + Math.random() * 0.3;
    const p = heartPoint(t, baseScale * jitter);
    const homeX = cx + p.x;
    const homeY = cy + p.y;

    particles.push({
      x: cx + (Math.random() - 0.5) * W,
      y: cy + (Math.random() - 0.5) * H,
      homeX, homeY,
      t,
      size: Math.random() * 1.8 + 0.6,
      hueShift: Math.random(),
      speed: 0.02 + Math.random() * 0.03,
      phase: Math.random() * Math.PI * 2,
      vx: 0,
      vy: 0
    });
  }
}
makeParticles();
window.addEventListener('resize', () => {
  resize();
  makeParticles();
  createSunflowers();
});

// ---------- Sunflowers (abaixo do coração) ----------
let sunflowers = [];
let petalBits = [];
let flowerTime = 0;

function createSunflowers() {
  sunflowers = [];
  const count = 5;
  for (let i = 0; i < count; i++) {
    const frac = count === 1 ? 0.5 : i / (count - 1);
    const fx = W * (0.14 + frac * 0.72) + (Math.random() - 0.5) * 18;
    sunflowers.push({
      x: fx,
      baseY: H + 6,
      stemHeight: H * 0.14 + Math.random() * (H * 0.05),
      size: 30 + Math.random() * 16,
      phase: Math.random() * Math.PI * 2,
      swaySpeed: 0.4 + Math.random() * 0.35,
      grow: 0,
      faceX: 0,
      faceY: -1
    });
  }
}
createSunflowers();

function drawLeaf(x, y, size, dir) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(dir * Math.PI / 7);
  ctx.fillStyle = 'rgba(58, 128, 48, 0.85)';
  ctx.shadowColor = 'rgba(58, 128, 48, 0.4)';
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.ellipse(dir * size * 0.55, 0, size * 0.65, size * 0.28, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSunflowers(time) {
  for (const s of sunflowers) {
    s.grow += (1 - s.grow) * 0.015;
    const g = s.grow;
    const sway = Math.sin(time * 0.0016 * s.swaySpeed + s.phase) * 9 * g;
    const stemTopX = s.x + sway;
    const stemTopY = s.baseY - s.stemHeight * g;

    // gentle heliotropism: petals lean toward the cursor when it's near
    let targetFX = 0, targetFY = -1;
    if (mouse.active) {
      const dx = mouse.x - stemTopX;
      const dy = mouse.y - stemTopY;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (d < 420) {
        targetFX = dx / d;
        targetFY = dy / d;
      }
    }
    s.faceX += (targetFX - s.faceX) * 0.025;
    s.faceY += (targetFY - s.faceY) * 0.025;

    const R = s.size * g;
    const headX = stemTopX + s.faceX * 16;
    const headY = stemTopY + s.faceY * 10;

    // stem
    ctx.strokeStyle = 'rgba(72, 138, 58, 0.9)';
    ctx.lineWidth = 4 * g;
    ctx.beginPath();
    ctx.moveTo(s.x, s.baseY);
    ctx.quadraticCurveTo(s.x + sway * 0.5, s.baseY - s.stemHeight * g * 0.6, stemTopX, stemTopY);
    ctx.stroke();

    drawLeaf(s.x + sway * 0.25, s.baseY - s.stemHeight * g * 0.35, R * 0.6, -1);
    drawLeaf(s.x + sway * 0.35, s.baseY - s.stemHeight * g * 0.6, R * 0.55, 1);

    // petals
    const petalCount = 16;
    const wobble = Math.sin(time * 0.003 + s.phase) * 0.06;
    for (let i = 0; i < petalCount; i++) {
      const ang = (Math.PI * 2 * i) / petalCount + wobble;
      const px = headX + Math.cos(ang) * R * 0.5;
      const py = headY + Math.sin(ang) * R * 0.5 * 0.7;
      const shimmer = 0.6 + 0.4 * Math.sin(time * 0.004 + i * 1.3);
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(ang);
      ctx.fillStyle = `hsla(45, 95%, ${52 + shimmer * 14}%, 0.95)`;
      ctx.shadowColor = 'rgba(250, 204, 21, 0.65)';
      ctx.shadowBlur = 7;
      ctx.beginPath();
      ctx.ellipse(0, 0, R * 0.32, R * 0.13, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;

    // center disc with seed texture
    const cg = ctx.createRadialGradient(headX, headY, 1, headX, headY, R * 0.4);
    cg.addColorStop(0, '#6b4423');
    cg.addColorStop(1, '#3b2410');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(headX, headY, R * 0.38, R * 0.38 * 0.72, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 220, 130, 0.35)';
    for (let k = 0; k < 10; k++) {
      const a = k * 2.4;
      const rr = (k / 10) * R * 0.34;
      ctx.beginPath();
      ctx.arc(headX + Math.cos(a) * rr, headY + Math.sin(a) * rr * 0.72, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    s._headX = headX;
    s._headY = headY;
    s._R = R;
  }
}

function spawnPetalBurst(x, y) {
  for (let i = 0; i < 32; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2.5 + Math.random() * 7;
    petalBits.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2.5,
      rot: Math.random() * Math.PI * 2,
      vr: (Math.random() - 0.5) * 0.3,
      size: 4 + Math.random() * 4,
      life: 1,
      decay: 0.01 + Math.random() * 0.012,
      hue: 40 + Math.random() * 20
    });
  }
}

function trySunflowerBurst(x, y) {
  for (const s of sunflowers) {
    if (s._headX === undefined) continue;
    const dx = x - s._headX;
    const dy = y - s._headY;
    if (Math.sqrt(dx * dx + dy * dy) < s._R * 1.4) {
      spawnPetalBurst(s._headX, s._headY);
    }
  }
}

// ---------- Mouse / touch ----------
let mouse = { x: cx, y: cy, active: false, px: cx, py: cy, vx: 0, vy: 0 };
let isDragging = false;

function updateMouseVelocity(nx, ny) {
  mouse.vx = nx - mouse.px;
  mouse.vy = ny - mouse.py;
  mouse.px = nx;
  mouse.py = ny;
}

window.addEventListener('mousedown', () => { isDragging = true; });
window.addEventListener('mouseup', () => { isDragging = false; });
window.addEventListener('mousemove', e => {
  updateMouseVelocity(e.clientX, e.clientY);
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  if (isDragging) spawnDragTrail(mouse.x, mouse.y, mouse.vx, mouse.vy);
});
window.addEventListener('mouseleave', () => { mouse.active = false; isDragging = false; });

window.addEventListener('touchstart', e => {
  if (e.touches.length) {
    isDragging = true;
    mouse.px = e.touches[0].clientX;
    mouse.py = e.touches[0].clientY;
  }
});
window.addEventListener('touchmove', e => {
  if (e.touches.length) {
    updateMouseVelocity(e.touches[0].clientX, e.touches[0].clientY);
    mouse.x = e.touches[0].clientX;
    mouse.y = e.touches[0].clientY;
    mouse.active = true;
    spawnDragTrail(mouse.x, mouse.y, mouse.vx, mouse.vy);
    e.preventDefault();
  }
}, { passive: false });
window.addEventListener('touchend', () => { mouse.active = false; isDragging = false; });

// ---------- Drag trail (dedo arrastando) ----------
let dragDust = [];
let trailPath = [];

function spawnDragTrail(x, y, vx, vy) {
  // record path point for the glowing ribbon
  trailPath.push({ x, y, life: 1 });
  if (trailPath.length > 40) trailPath.shift();

  const speed = Math.sqrt(vx * vx + vy * vy);
  const count = Math.min(6, Math.max(1, Math.floor(speed / 3)));

  for (let i = 0; i < count; i++) {
    dragDust.push({
      x: x + (Math.random() - 0.5) * 6,
      y: y + (Math.random() - 0.5) * 6,
      vx: -vx * 0.08 + (Math.random() - 0.5) * 1.5,
      vy: -vy * 0.08 + (Math.random() - 0.5) * 1.5,
      size: Math.random() * 2.5 + 1,
      life: 1,
      decay: 0.02 + Math.random() * 0.02,
      hue: 195 + Math.random() * 35
    });
  }

  // drag nearby heart particles along with the finger, like being smeared
  const dragRadius = 120;
  for (const p of particles) {
    const dx = p.x - x;
    const dy = p.y - y;
    const dist = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dist < dragRadius) {
      const pull = (1 - dist / dragRadius) * 0.55;
      p.vx += vx * pull * 0.25;
      p.vy += vy * pull * 0.25;
    }
  }
}

// pulses + sparks triggered by click/tap = EXPLOSION
let pulses = [];
let sparks = [];
let flash = 0;
let shake = 0;

function addExplosion(x, y) {
  // multiple shockwave rings
  for (let i = 0; i < 3; i++) {
    pulses.push({ x, y, r: i * 18, alpha: 1, width: 3 - i * 0.7 });
  }

  // radial burst of sparks
  const sparkCount = 140;
  for (let i = 0; i < sparkCount; i++) {
    const angle = (Math.PI * 2 * i) / sparkCount + Math.random() * 0.2;
    const speed = 4 + Math.random() * 14;
    const hue = 185 + Math.random() * 60; // blue -> cyan -> a bit of white-hot
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 3 + 1.2,
      life: 1,
      decay: 0.012 + Math.random() * 0.02,
      hue,
      gravity: 0.06 + Math.random() * 0.05
    });
  }

  // extra fast "shrapnel" streaks
  for (let i = 0; i < 40; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 12 + Math.random() * 20;
    sparks.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 1.5 + 0.5,
      life: 1,
      decay: 0.02 + Math.random() * 0.03,
      hue: 200 + Math.random() * 40,
      gravity: 0.03,
      streak: true
    });
  }

  // kick nearby heart particles outward violently
  for (const p of particles) {
    const dx = p.x - x;
    const dy = p.y - y;
    const dist = Math.sqrt(dx*dx + dy*dy) || 1;
    const radius = 260;
    if (dist < radius) {
      const force = (1 - dist / radius) * 18;
      p.vx += (dx / dist) * force;
      p.vy += (dy / dist) * force;
    }
  }

  flash = Math.min(1, flash + 0.55);
  shake = 14;
}

window.addEventListener('click', e => {
  addExplosion(e.clientX, e.clientY);
  trySunflowerBurst(e.clientX, e.clientY);
});
window.addEventListener('touchstart', e => {
  if (e.touches.length) {
    addExplosion(e.touches[0].clientX, e.touches[0].clientY);
    trySunflowerBurst(e.touches[0].clientX, e.touches[0].clientY);
  }
});

// ---------- Beat animation ----------
let beatT = 0;

function drawGlow() {
  const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.55);
  g.addColorStop(0, 'rgba(56, 189, 248, 0.10)');
  g.addColorStop(0.5, 'rgba(11, 26, 58, 0.05)');
  g.addColorStop(1, 'rgba(3, 7, 18, 0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  ctx.save();

  // screen shake decays
  if (shake > 0.1) {
    const sx = (Math.random() - 0.5) * shake;
    const sy = (Math.random() - 0.5) * shake;
    ctx.translate(sx, sy);
    shake *= 0.85;
  } else {
    shake = 0;
  }

  // trail fade
  ctx.fillStyle = 'rgba(3, 7, 18, 0.18)';
  ctx.fillRect(-30, -30, W + 60, H + 60);

  drawGlow();

  flowerTime += 16;
  drawSunflowers(flowerTime);

  // falling petal bits from sunflower bursts
  ctx.globalCompositeOperation = 'source-over';
  petalBits.forEach(p => {
    p.vy += 0.12; // gravity
    p.x += p.vx;
    p.y += p.vy;
    p.rot += p.vr;
    p.life -= p.decay;
  });
  petalBits = petalBits.filter(p => p.life > 0);
  for (const p of petalBits) {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = `hsla(${p.hue}, 95%, 58%, ${Math.max(p.life, 0)})`;
    ctx.shadowColor = 'rgba(250, 204, 21, 0.5)';
    ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.shadowBlur = 0;

  beatT += 0.045;
  const beat = 1 + Math.sin(beatT) * 0.045 + Math.max(0, Math.sin(beatT * 2)) * 0.03;

  const baseScale = (Math.min(W, H) / 34) * beat;

  for (const p of particles) {
    // recompute home position with beating scale
    const hp = heartPoint(p.t, baseScale);
    p.homeX = cx + hp.x;
    p.homeY = cy + hp.y;

    // gentle float around home
    p.phase += p.speed;
    const floatX = Math.cos(p.phase) * 3;
    const floatY = Math.sin(p.phase * 1.3) * 3;

    let targetX = p.homeX + floatX;
    let targetY = p.homeY + floatY;

    // mouse repel/attract magic
    if (mouse.active) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const radius = 140;
      if (dist < radius) {
        const force = (radius - dist) / radius;
        targetX += (dx / dist) * force * 60;
        targetY += (dy / dist) * force * 60;
      }
    }

    // spring toward target
    p.vx += (targetX - p.x) * 0.02;
    p.vy += (targetY - p.y) * 0.02;
    p.vx *= 0.85;
    p.vy *= 0.85;
    p.x += p.vx;
    p.y += p.vy;

    // color: blue spectrum with subtle shimmer
    const shimmer = 0.5 + 0.5 * Math.sin(beatT * 2 + p.hueShift * 10);
    const lightness = 55 + shimmer * 25;
    const hue = 195 + p.hueShift * 25; // cyan-blue range

    ctx.beginPath();
    const r = p.size * (1 + shimmer * 0.6) * (0.9 + (beat - 1) * 4);
    ctx.fillStyle = `hsla(${hue}, 100%, ${lightness}%, ${0.55 + shimmer * 0.35})`;
    ctx.shadowColor = `hsla(${hue}, 100%, 70%, 0.9)`;
    ctx.shadowBlur = 8;
    ctx.arc(p.x, p.y, Math.max(r, 0.3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;

  // drag trail ribbon (dedo arrastando)
  if (trailPath.length > 1) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 1; i < trailPath.length; i++) {
      const a = trailPath[i - 1];
      const b = trailPath[i];
      const t = i / trailPath.length;
      ctx.beginPath();
      ctx.strokeStyle = `hsla(200, 100%, 75%, ${t * 0.5})`;
      ctx.lineWidth = t * 10;
      ctx.shadowColor = 'rgba(96, 165, 250, 0.9)';
      ctx.shadowBlur = 14;
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }
  if (!isDragging && trailPath.length) {
    trailPath.shift();
  }

  // drag dust particles
  ctx.globalCompositeOperation = 'lighter';
  dragDust.forEach(d => {
    d.x += d.vx;
    d.y += d.vy;
    d.vx *= 0.94;
    d.vy *= 0.94;
    d.life -= d.decay;
  });
  dragDust = dragDust.filter(d => d.life > 0);
  for (const d of dragDust) {
    ctx.beginPath();
    ctx.fillStyle = `hsla(${d.hue}, 100%, 78%, ${Math.max(d.life, 0)})`;
    ctx.shadowColor = `hsla(${d.hue}, 100%, 80%, 1)`;
    ctx.shadowBlur = 8;
    ctx.arc(d.x, d.y, Math.max(d.size * d.life, 0.2), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = 'source-over';

  // pulses (click magic shockwave rings)
  pulses.forEach(p => {
    p.r += 9;
    p.alpha *= 0.945;
  });
  pulses = pulses.filter(p => p.alpha > 0.02);

  ctx.shadowBlur = 0;
  for (const p of pulses) {
    ctx.beginPath();
    ctx.strokeStyle = `rgba(165, 243, 252, ${p.alpha})`;
    ctx.lineWidth = p.width || 1.5;
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.stroke();
  }

  // sparks / shrapnel explosion debris
  ctx.globalCompositeOperation = 'lighter';
  sparks.forEach(s => {
    s.x += s.vx;
    s.y += s.vy;
    s.vx *= 0.96;
    s.vy = s.vy * 0.96 + s.gravity * 0;
    s.life -= s.decay;
  });
  sparks = sparks.filter(s => s.life > 0);

  for (const s of sparks) {
    const lightness = 60 + s.life * 30;
    ctx.beginPath();
    ctx.fillStyle = `hsla(${s.hue}, 100%, ${lightness}%, ${Math.max(s.life, 0)})`;
    ctx.shadowColor = `hsla(${s.hue}, 100%, 75%, 1)`;
    ctx.shadowBlur = 10;
    if (s.streak) {
      // draw as a short streak line for the fast shrapnel
      ctx.strokeStyle = ctx.fillStyle;
      ctx.lineWidth = s.size;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - s.vx * 0.6, s.y - s.vy * 0.6);
      ctx.stroke();
    } else {
      ctx.arc(s.x, s.y, Math.max(s.size * s.life, 0.2), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.shadowBlur = 0;

  // white flash on explosion, fading fast
  if (flash > 0.01) {
    ctx.fillStyle = `rgba(200, 235, 255, ${flash * 0.35})`;
    ctx.fillRect(-30, -30, W + 60, H + 60);
    flash *= 0.82;
  } else {
    flash = 0;
  }

  ctx.restore();

  requestAnimationFrame(animate);
}

// initial fade-in fill so trail doesn't start on pure black abruptly
ctx.fillStyle = '#030712';
ctx.fillRect(0, 0, W, H);

animate();
</script>
</body>
</html>
